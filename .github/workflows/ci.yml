name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: ./scripts/bundle.sh
      - name: Render previews
        run: .build/debug/Kumquat --render-previews build/previews
      - uses: actions/upload-artifact@v4
        with:
          name: Kumquat
          path: |
            build/Kumquat.zip
            build/icon-1024.png
            build/previews
          retention-days: 14
