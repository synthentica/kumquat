name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The bundled FFmpeg is slow to build, so it has its own job and is cached until the script changes.
  ffmpeg:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cache FFmpeg
        id: cache
        uses: actions/cache@v4
        with:
          path: .ffmpeg/bin
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install nasm
          ./scripts/build-ffmpeg.sh

  build:
    needs: ffmpeg
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Restore FFmpeg
        uses: actions/cache/restore@v4
        with:
          path: .ffmpeg/bin
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          fail-on-cache-miss: true
      - name: Build
        run: swift build
      - name: Test
        env:
          KUMQUAT_FFMPEG: ${{ github.workspace }}/.ffmpeg/bin/ffmpeg
        run: swift test
      - name: Bundle app
        run: ./scripts/bundle.sh
      - name: Render previews
        run: .build/debug/Kumquat --render-previews build/previews
      - name: Benchmark against the budgets
        # The release app, with the real wheel and toast. A CI runner is a shared VM, so this reports
        # instead of failing; the budgets are judged on a real Mac with scripts/profile.sh.
        run: |
          build/Kumquat.app/Contents/MacOS/Kumquat --benchmark build/previews/benchmark.json | tee build/benchmark.txt
          { echo '### Budgets on the CI runner'; echo '```'; cat build/benchmark.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Kumquat
          path: |
            build/Kumquat.zip
            build/icon-1024.png
            build/previews
          retention-days: 14
      - name: Publish previews
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/previews
          cp build/previews/*.png build/previews/*.gif build/previews/*.json build/icon-1024.png /tmp/previews/
          cd /tmp/previews
          git init -q -b previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Previews for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" previews

  # Converts ~50 hard real-world files and checks every result with outside tools.
  corpus:
    needs: ffmpeg
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Check for a manifest
        id: check
        run: '[ -f Tests/Corpus/manifest.json ] || { echo "::notice::No corpus manifest yet"; echo skip=1 >> "$GITHUB_OUTPUT"; }'
      - name: Restore FFmpeg
        if: steps.check.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: .ffmpeg/bin
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          fail-on-cache-miss: true
      - name: Cache corpus files
        if: steps.check.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: .corpus/files
          key: corpus-${{ hashFiles('Tests/Corpus/manifest.json') }}
      - name: Install the outside judges
        if: steps.check.outputs.skip != '1'
        run: |
          brew install ffmpeg qpdf
          brew install verapdf || echo "::warning::veraPDF isn't available from Homebrew; PDF/A checks are skipped"
          brew install --cask libreoffice || echo "::warning::LibreOffice didn't install; office outputs are skipped"
      - name: Build
        if: steps.check.outputs.skip != '1'
        run: swift build -c release
      - name: Convert and check
        if: steps.check.outputs.skip != '1'
        env:
          KUMQUAT_FFMPEG: ${{ github.workspace }}/.ffmpeg/bin/ffmpeg
        run: scripts/corpus.sh .build/release/Kumquat
      - name: Summary
        if: always() && steps.check.outputs.skip != '1'
        run: '[ -f .corpus/report.md ] && cat .corpus/report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.skip != '1'
        with:
          name: corpus-report
          path: |
            .corpus/report.md
            .corpus/report.json
            .corpus/results.jsonl
          retention-days: 30
      - name: Publish the report
        if: always() && steps.check.outputs.skip != '1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f .corpus/report.md ] || exit 0
          mkdir -p /tmp/corpus-report
          cp .corpus/report.md .corpus/report.json .corpus/results.jsonl /tmp/corpus-report/
          cd /tmp/corpus-report
          git init -q -b corpus-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Corpus report for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" corpus-report
