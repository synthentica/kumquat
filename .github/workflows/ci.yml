name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The bundled FFmpeg is slow to build, so it has its own job and is cached until the script changes.
  ffmpeg:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cache FFmpeg
        id: cache
        uses: actions/cache@v4
        with:
          path: .ffmpeg/bin
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install nasm
          ./scripts/build-ffmpeg.sh

  build:
    needs: ffmpeg
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Restore FFmpeg
        uses: actions/cache/restore@v4
        with:
          path: .ffmpeg/bin
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}
          fail-on-cache-miss: true
      - name: Build
        run: swift build
      - name: Test
        env:
          KUMQUAT_FFMPEG: ${{ github.workspace }}/.ffmpeg/bin/ffmpeg
        run: swift test
      - name: Bundle app
        run: ./scripts/bundle.sh
      - name: Render previews
        run: .build/debug/Kumquat --render-previews build/previews
      - name: Benchmark against the budgets
        # The release app, with the real wheel and toast. A CI runner is a shared VM, so this reports
        # instead of failing; the budgets are judged on a real Mac with scripts/profile.sh.
        run: |
          build/Kumquat.app/Contents/MacOS/Kumquat --benchmark build/previews/benchmark.json | tee build/benchmark.txt
          { echo '### Budgets on the CI runner'; echo '```'; cat build/benchmark.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Kumquat
          path: |
            build/Kumquat.zip
            build/icon-1024.png
            build/previews
          retention-days: 14
      - name: Publish previews
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/previews
          cp build/previews/*.png build/previews/*.gif build/previews/*.json build/icon-1024.png /tmp/previews/
          cd /tmp/previews
          git init -q -b previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Previews for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" previews
